<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gi Tools</title><style>:root{--bg:#fff;--side:#f7f7f5;--text:#202020;--muted:#777;--hover:#ececea;--border:#e6e6e2}html[data-theme=dark]{--bg:#000;--side:#111;--text:#f2f2ef;--muted:#999;--hover:#242424;--border:#2d2d2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.layout{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.side{background:var(--side);padding:24px 14px;display:flex;flex-direction:column;border-right:1px solid var(--border)}.brand{font-size:21px;font-weight:700;padding:7px 12px 24px}.nav{display:grid;gap:3px}.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:inherit;font-size:15px}.nav a:hover,.nav a.active{background:var(--hover)}.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}.bottom{margin-top:auto}.theme{width:42px;height:42px;border:0;border-radius:10px;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer}.theme:hover{background:var(--hover)}.theme svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}.main{padding:48px 54px;max-width:1100px;width:100%}.main h1{font-size:30px;letter-spacing:-.035em;margin:0 0 8px}.sub{color:var(--muted);margin-bottom:42px}.section-title{font-size:16px;font-weight:650;margin:0 0 18px}.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 28px}.app{display:flex;align-items:center;gap:14px;padding:10px;border-radius:14px;text-decoration:none;color:inherit;transition:.15s}.app:hover{background:var(--hover)}.icon{width:52px;height:52px;flex:0 0 52px;border-radius:13px;border:1px solid var(--border);display:grid;place-items:center;background:var(--side)}.icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7}.info strong{display:block;font-size:15px;margin-bottom:4px}.info span{display:block;color:var(--muted);font-size:12px;line-height:1.35}.mobile-head{display:none}@media(max-width:700px){.layout{display:block}.side{display:none}.mobile-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 4px}.mobile-head strong{font-size:20px}.main{padding:30px 16px}.main h1{font-size:28px}.apps{grid-template-columns:1fr}.app{padding:10px 4px}.mobile-head .theme{display:grid}}</style></head><body><div class="mobile-head"><strong>Gi Tools</strong><button class="theme" data-theme aria-label="Alternar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg></button></div><div class="layout"><aside class="side"><div class="brand">Gi Tools</div><nav class="nav"><a class="active" href="./"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></svg>Início</a><a href="./escrita-diaria/"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 16l10-10 2 2L8 18H6z"/></svg>Escrita diária</a><a href="./check-in-diario/"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 15l2 2 5-5"/></svg>Check-in diário</a></nav><div class="bottom"><button class="theme" data-theme aria-label="Alternar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg></button></div></aside><main class="main"><h1>Gi Tools</h1><div class="sub">Minhas ferramentas.</div><div class="section-title">Apps</div><div class="apps"><a class="app" href="./escrita-diaria/"><div class="icon"><svg viewBox="0 0 24 24"><path d="M5 19h14M7 15l9-9 2 2-9 9H7z"/></svg></div><div class="info"><strong>Escrita diária</strong><span>10 minutos para pensar escrevendo.</span></div></a><a class="app" href="./check-in-diario/"><div class="icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v16H4zM8 3v4M16 3v4M4 10h16"/><path d="m8 15 2 2 5-5"/></svg></div><div class="info"><strong>Check-in diário</strong><span>Mente, alma, day-saver e diário.</span></div></a></div></main></div><script>function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('gi-theme',t)}applyTheme(localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));</script></body></html>
