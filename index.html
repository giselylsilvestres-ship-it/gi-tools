<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>meus apps</title><script>document.documentElement.dataset.theme=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./gi-supabase-config.js"></script><link rel="stylesheet" href="./gi-mobile-nav.css"><style>:root{--bg:#fff;--surface:#fff;--surface-2:#f4f4f1;--text:#202020;--muted:#777;--border:#e5e5e1}html[data-theme=dark]{--bg:#000;--surface:#111;--surface-2:#202020;--text:#f2f2ef;--muted:#999;--border:#2d2d2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.main{padding:52px 56px;max-width:1120px;width:100%}h1{font-size:31px;letter-spacing:-.035em;margin:0 0 8px;text-transform:lowercase}.sub{color:var(--muted);margin-bottom:42px;font-size:16px}.section-title{font-size:15px;font-weight:650;margin:0 0 18px}.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 28px}.app-card{display:flex;align-items:center;gap:14px;padding:10px;border-radius:14px;text-decoration:none;color:inherit}.app-card:hover{background:var(--surface-2)}.icon{width:52px;height:52px;flex:0 0 52px;border-radius:13px;border:1px solid var(--border);display:grid;place-items:center;background:var(--surface)}.icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.info strong{display:block;font-size:15px;margin-bottom:4px}.info span{display:block;color:var(--muted);font-size:12px;line-height:1.35}.boot{min-height:100vh;background:var(--bg)}@media(max-width:700px){.main{padding:34px 18px 90px}.apps{grid-template-columns:1fr}}</style></head><body><div id="boot" class="boot"></div><main id="homeApp" class="main" hidden><h1>meus apps</h1><div class="sub">hub de ferramentas importantes pro meu dia.</div><div class="section-title">Apps</div><div class="apps"><a class="app-card" href="./escrita-diaria/"><div class="icon"><svg viewBox="0 0 24 24"><path d="M5 19h14M7 15l9-9 2 2-9 9H7z"/></svg></div><div class="info"><strong>Escrita diária</strong><span>10 minutos para pensar escrevendo.</span></div></a><a class="app-card" href="./check-in-diario/"><div class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 15l2 2 5-5"/></svg></div><div class="info"><strong>Check-in diário</strong><span>Mente, alma, coisa boa e anotações.</span></div></a><a class="app-card" href="./academia/"><div class="icon"><svg viewBox="0 0 24 24"><path d="M5 9v6M8 7v10M16 7v10M19 9v6M8 12h8"/></svg></div><div class="info"><strong>Academia</strong><span>Treinões, fichas, sessões e cargas.</span></div></a></div></main><script>const c=supabase.createClient(GI_SUPABASE_URL,GI_SUPABASE_KEY),next=new URLSearchParams(location.search).get('next');c.auth.getSession().then(({data:{session}})=>{if(!session){location.replace('/login.html'+(next&&next.startsWith('/')?'?next='+encodeURIComponent(next):''));return}document.getElementById('boot').remove();homeApp.hidden=false;if(next&&next.startsWith('/')){location.replace(next);return}const s=document.createElement('script');s.src='./gi-nav.js';document.body.appendChild(s)});</script></body></html>
