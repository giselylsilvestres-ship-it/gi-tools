<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gi Tools</title><style>:root{--bg:#f7f7f5;--card:#fff;--txt:#1f1f1f;--muted:#777;--bd:#deded8}@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1a1a1a;--txt:#f3f3f1;--muted:#999;--bd:#303030}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:56px 24px}h1{font-size:52px;letter-spacing:-.045em;margin:0 0 10px}.sub{color:var(--muted);font-size:17px;margin-bottom:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;min-height:150px}.card h2{margin:0 0 8px;font-size:22px}.card p{margin:0;color:var(--muted);line-height:1.5}.plus{margin-top:18px;color:var(--muted);font-size:13px}@media(max-width:600px){.wrap{padding:34px 16px}h1{font-size:42px}}</style></head><body><main class="wrap"><h1>Gi Tools</h1><div class="sub">Meus apps.</div><div class="grid"><a class="card" href="./escrita-diaria/"><h2>Escrita diária</h2><p>10 minutos para pensar escrevendo.</p></a><a class="card" href="./check-in-diario/"><h2>Check-in diário</h2><p>Mente, alma, day-saver e uma nota sobre o dia.</p></a></div><div class="plus">Novos apps entram aqui sem mexer nos existentes.</div></main><script src="./gi-nav.js"></script></body></html>
