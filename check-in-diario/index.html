<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Check-in diário</title><script>document.documentElement.dataset.theme=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><link rel="stylesheet" href="./app.css"></head><body><main class="app"><header><strong>Check-in diário</strong><div class="right"><nav><button data-view="calendar" class="active">Calendário</button><button data-view="history">Histórico</button></nav><button id="theme" class="theme" aria-label="Alternar tema">☼</button><button id="logout" class="logout" style="display:none">Sair</button></div></header><section id="auth" class="view"><div class="auth"><h1>Check-in diário</h1><p>Entre para acessar seus check-ins.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="login" class="primary">Entrar</button><small id="authmsg"></small></div></section><section id="calendar" class="view active"><div class="hero"><h1 id="monthTitle"></h1><div class="stats"><div><b id="total">0</b><span>check-ins</span></div><div><b id="days">0</b><span>dias ativos</span></div><div><b id="mindAvg">—</b><span>mente média</span></div><div><b id="soulAvg">—</b><span>alma média</span></div></div></div><div class="calendar-head"><button id="prev">‹</button><strong id="monthSmall"></strong><button id="next">›</button></div><div class="week"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div><div id="grid" class="grid"></div><button id="todayBtn" class="primary checkin-btn">Fazer check-in de hoje</button></section><section id="history" class="view"><h1>Histórico</h1><div id="list" class="list"></div></section><section id="form" class="view"><button id="back" class="back">‹ Voltar</button><div class="form-head"><span id="formDate"></span><h1>Como foi seu dia?</h1></div><div class="question"><h2>Mente</h2><p>Como estava sua clareza mental?</p><div class="scale" id="mind"></div></div><div class="question"><h2>Alma</h2><p>Como você se sentiu hoje?</p><div class="scale" id="soul"></div></div><div class="question"><h2>Day-saver</h2><p id="daySaverPrompt">O que salvou seu dia?</p><input id="saver" class="textline" placeholder="Uma coisa que vale guardar..."></div><div class="question note"><h2>Nota do dia <span>opcional</span></h2><textarea id="note" placeholder="Escreva sobre o seu dia..."></textarea></div><button id="save" class="primary save">Salvar check-in</button></section></main><script src="./app.js"></script><script src="../gi-nav.js"></script></body></html>
