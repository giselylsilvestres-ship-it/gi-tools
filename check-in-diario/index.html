<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Check-in diário</title><script>document.documentElement.dataset.theme=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><link rel="stylesheet" href="./app.css"></head><body><main class="app"><header class="app-header"><strong>Check-in diário</strong><div class="right"><div class="view-switch"><button data-view="calendar" class="active">Calendário</button><button data-view="history">Histórico</button></div><button id="theme" class="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header><section id="calendar" class="view active"><div class="profile-block"><img id="calendarAvatar" class="profile-avatar" alt=""><div class="profile-name">Gisely</div><div class="stats"><div><b id="total">0</b><span>check-ins</span></div><div><b id="days">0</b><span>dias ativos</span></div><div><b id="monthCount">0</b><span>neste mês</span></div></div></div><h1 id="monthTitle" class="month-title"></h1><div class="week"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div><div class="calendar-shell"><button id="prev" class="month-arrow prev" aria-label="Mês anterior">‹</button><div id="grid" class="grid"></div><button id="next" class="month-arrow next" aria-label="Próximo mês">›</button></div></section><section id="history" class="view"><h1 class="history-title">Histórico</h1><div id="list" class="list"></div></section></main><div id="modal" class="modal" hidden><button class="modal-backdrop" id="modalBackdrop" aria-label="Fechar"></button><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div id="formDate" class="modal-date"></div><h2 id="modalTitle">Check-in do dia</h2></div><button id="closeModal" class="close" aria-label="Fechar">×</button></div><div class="field"><label>Mente</label><div class="multi"><button id="mindTrigger" class="multi-trigger" type="button"><span>Selecionar</span><svg viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></svg></button><div id="mindMenu" class="multi-menu"></div></div></div><div class="field"><label>Alma</label><div class="multi"><button id="soulTrigger" class="multi-trigger" type="button"><span>Selecionar</span><svg viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></svg></button><div id="soulMenu" class="multi-menu"></div></div></div><div class="field"><label>Motivo de alegria</label><input id="joy" class="textline" placeholder="O que trouxe alegria hoje?"></div><div class="field"><label>Nota do dia</label><textarea id="note" placeholder="Escreva sobre o seu dia..."></textarea></div><button id="save" class="primary save">Salvar check-in</button></section></div><script src="../gi-nav.js"></script><script src="./app.js"></script></body></html>
