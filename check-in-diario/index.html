<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Check-in diário</title><script>document.documentElement.dataset.theme=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../gi-supabase-config.js"></script><script src="../gi-auth-guard.js"></script><script src="./supabase-config.js"></script><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="../gi-mobile-nav.css"></head><body><main class="app"><header class="app-header"><strong>Check-in diário</strong><div class="right"><div class="view-switch"><button data-view="calendar" class="active">Calendário</button><button data-view="history">Histórico</button></div><button id="theme" class="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header><section id="calendar" class="view active"><div class="profile-block"><button id="calendarAvatarButton" class="calendar-avatar-button" aria-label="Editar foto"><img id="calendarAvatar" class="profile-avatar" alt="Gisely"><span class="avatar-edit-badge">✎</span></button><div class="profile-name">Gisely</div></div><div class="metric-grid"><div class="metric-card"><strong id="total">0</strong><span>check-ins únicos</span><small>Dias diferentes desde o início</small></div><div class="metric-card"><strong id="monthCount">0</strong><span>check-ins no mês</span><small id="monthConsistency">0% de consistência</small></div><div class="metric-card"><strong id="mindMode">—</strong><span>mente</span><small>Predominante no mês</small></div><div class="metric-card"><strong id="soulMode">—</strong><span>alma</span><small>Predominante no mês</small></div></div><h1 id="monthTitle" class="month-title"></h1><div class="week"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div><div class="calendar-shell"><button id="prev" class="month-arrow prev" aria-label="Mês anterior">‹</button><div id="grid" class="grid"></div><button id="next" class="month-arrow next" aria-label="Próximo mês">›</button></div></section><section id="history" class="view"><h1 class="history-title">Histórico</h1><div id="list" class="list"></div></section></main><div id="modal" class="modal" hidden><button class="modal-backdrop" id="modalBackdrop" aria-label="Fechar"></button><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div id="formDate" class="modal-date"></div><h2 id="modalTitle">Check-in do dia</h2></div><button id="closeModal" class="close" aria-label="Fechar">×</button></div><div class="field"><label>mente</label><div class="state-picker"><button id="mindTrigger" class="state-trigger" type="button"><span>selecionar</span><b>⌄</b></button><div id="mindMenu" class="state-menu"></div></div></div><div class="field"><label>alma</label><div class="state-picker"><button id="soulTrigger" class="state-trigger" type="button"><span>selecionar</span><b>⌄</b></button><div id="soulMenu" class="state-menu"></div></div></div><div class="field"><label>coisa boa</label><input id="joy" class="textline" placeholder="O que teve de bom hoje?"></div><div class="field"><label>anotações</label><textarea id="note" placeholder="Escreva sobre o seu dia..."></textarea></div><div class="modal-actions"><button id="edit" class="edit-button" type="button" hidden aria-label="Editar check-in"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m13 7 4 4"/></svg></button><button id="save" class="send-button" type="button" aria-label="Salvar check-in"><svg viewBox="0 0 24 24"><path d="M12 18V6M7.5 10.5 12 6l4.5 4.5"/></svg></button></div></section></div><script src="./app.js"></script><script src="./metrics.js"></script><script src="./dropdown-fix.js"></script></body></html>
