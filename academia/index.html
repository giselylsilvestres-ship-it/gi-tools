<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Academia</title><script>document.documentElement.dataset.theme=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../gi-supabase-config.js"></script><script src="../gi-auth-guard.js"></script><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="../gi-mobile-nav.css"></head><body><main class="app"><header class="app-header"><strong>Academia</strong><div class="right"><div class="view-switch"><button data-view="week" class="active">Semana</button><button data-view="programs">Treinões</button></div><button id="theme" class="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header><section id="week" class="view active"><div class="week-head"><div><small id="activeProgramLabel">treinão ativo</small><h1 id="weekTitle">Esta semana</h1></div><div class="week-nav"><button id="prevWeek">‹</button><button id="todayWeek">hoje</button><button id="nextWeek">›</button></div></div><div id="weekGrid" class="week-grid"></div><div id="emptyWeek" class="empty-state" hidden><strong>Nenhum treinão ativo</strong><span>Crie um treinão, cadastre as fichas e marque-o como ativo para montar sua semana.</span><button data-go-programs>criar treinão</button></div></section><section id="programs" class="view"><div class="section-head"><div><small>suas rotinas</small><h1>Treinões</h1></div><button id="newProgram" class="primary">+ novo treinão</button></div><div id="programList" class="program-list"></div></section></main><div id="sessionModal" class="modal" hidden><button class="modal-backdrop" data-close-session></button><section class="modal-card"><div class="modal-head"><div><small id="sessionDate"></small><h2 id="sessionTitle"></h2></div><button class="close" data-close-session>×</button></div><div id="sessionExercises" class="session-exercises"></div><div class="modal-actions"><button id="saveSession" class="primary">salvar sessão</button></div></section></div><div id="programModal" class="modal" hidden><button class="modal-backdrop" data-close-program></button><section class="modal-card program-modal"><div class="modal-head"><div><small>treinão</small><h2 id="programTitle"></h2></div><button class="close" data-close-program>×</button></div><div class="program-actions"><button id="favoriteProgram" class="soft"></button><button id="activateProgram" class="soft"></button><button id="deleteProgram" class="danger">excluir</button></div><div class="divider"></div><div class="subhead"><strong>Treinos</strong><button id="newWorkout" class="soft">+ treino</button></div><div id="workoutList" class="workout-list"></div></section></div><div id="formModal" class="modal" hidden><button class="modal-backdrop" data-close-form></button><section class="modal-card small-modal"><div class="modal-head"><div><small id="formEyebrow"></small><h2 id="formTitle"></h2></div><button class="close" data-close-form>×</button></div><div id="formBody"></div><div class="modal-actions"><button id="formSave" class="primary">salvar</button></div></section></div><script src="./app.js"></script></body></html>
