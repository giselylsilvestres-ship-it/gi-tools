<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gica-tools</title><script>document.documentElement.dataset.theme=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./gi-supabase-config.js"></script><style>:root{--bg:#f4efe5;--surface:#fbf8f1;--text:#1d1c1a;--muted:#77736d;--border:#ddd7cc;--button:#1d1c1a;--button-text:#f7f2e8;--logo:#1d1c1a}html[data-theme=dark]{--bg:#11110f;--surface:#1a1917;--text:#f3eee4;--muted:#9d9890;--border:#34312d;--button:#eee7da;--button-text:#171614;--logo:#eee7da}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px)}.brand-block{text-align:center;margin:0 0 28px}.brand{width:84px;height:84px;margin:0 auto 14px;display:block;color:var(--logo)}.brand svg{display:block;width:100%;height:100%;overflow:visible}.brand path{fill:currentColor}h1{font-size:34px;line-height:1.05;letter-spacing:-.04em;margin:0;text-transform:lowercase;font-weight:700}p{color:var(--muted);margin:10px 0 24px;font-size:15px}.field{position:relative}input{width:100%;padding:15px 48px 15px 16px;margin:6px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--text)}.enter{width:100%;margin-top:10px;padding:15px;border:0;border-radius:14px;background:var(--button);color:var(--button-text);font:inherit;font-weight:650}.eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}.eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}.msg{min-height:18px;margin-top:10px;color:var(--muted);font-size:12px}</style></head><body><main class="wrap"><section class="card"><div class="brand-block"><div class="brand" aria-label="Gica Tools"><svg viewBox="0 0 100 100" role="img" aria-hidden="true"><path d="M68.5 11.5c12.1 0 21.9 9.8 21.9 21.9 0 10.7-7.7 19.6-17.9 21.5-7.7 1.4-14.8.4-20.3 4.5-3.4 2.5-4.7 6.8-2.7 10.2 2.6 4.5 8.7 5.4 14.2 7.6 8.9 3.5 14.8 11.1 14.8 20.1 0 12.1-9.8 21.9-21.9 21.9-10.2 0-17.1-6.5-22.1-14.9-5.4-9.1-10.3-16.5-19.2-20.5C6.1 79.6 1.8 71.5 4.2 63.4c2.4-8.1 9.6-12.8 18.7-15.5 11.1-3.3 19.4-6.4 25.4-15.6 5.8-8.9 9.1-20.8 20.2-20.8Z" transform="translate(4 -8) scale(.92)"/></svg></div><h1>gica-tools</h1></div><p>Entre para acessar suas ferramentas.</p><input id="email" type="email" placeholder="E-mail" autocomplete="email"><div class="field"><input id="password" type="password" placeholder="Senha" autocomplete="current-password"><button id="eye" class="eye" type="button" aria-label="Mostrar senha"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><button id="login" class="enter">Entrar</button><div id="msg" class="msg"></div></section></main><script>const c=supabase.createClient(GI_SUPABASE_URL,GI_SUPABASE_KEY),next=new URLSearchParams(location.search).get('next');c.auth.getSession().then(({data:{session}})=>{if(session)location.replace(next&&next.startsWith('/')?next:'/')});login.onclick=async()=>{msg.textContent='';const{error}=await c.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.replace(next&&next.startsWith('/')?next:'/')};password.addEventListener('keydown',e=>{if(e.key==='Enter')login.click()});eye.onclick=()=>{const reveal=password.type==='password';password.type=reveal?'text':'password';eye.setAttribute('aria-label',reveal?'Ocultar senha':'Mostrar senha')}</script></body></html>
