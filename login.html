<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gica-tools</title><script>document.documentElement.dataset.theme=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./gi-supabase-config.js"></script><style>:root{--bg:#fff;--surface:#fff;--text:#202020;--muted:#777;--border:#e5e5e1;--accent:#b56576}html[data-theme=dark]{--bg:#000;--surface:#111;--text:#f2f2ef;--muted:#999;--border:#2d2d2d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px)}h1{font-size:42px;letter-spacing:-.04em;margin:0 0 8px;text-transform:lowercase}p{color:var(--muted);margin:10px 0 24px}.field{position:relative}input{width:100%;padding:14px 48px 14px 15px;margin:6px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;outline:none}.enter{width:100%;margin-top:8px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:650}.eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}.eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}.msg{min-height:18px;margin-top:10px;color:var(--muted);font-size:12px}</style></head><body><main class="wrap"><section class="card"><h1>gica-tools</h1><p>Entre para acessar suas ferramentas.</p><input id="email" type="email" placeholder="E-mail" autocomplete="email"><div class="field"><input id="password" type="password" placeholder="Senha" autocomplete="current-password"><button id="eye" class="eye" type="button" aria-label="Mostrar senha"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><button id="login" class="enter">Entrar</button><div id="msg" class="msg"></div></section></main><script>const c=supabase.createClient(GI_SUPABASE_URL,GI_SUPABASE_KEY),next=new URLSearchParams(location.search).get('next');c.auth.getSession().then(({data:{session}})=>{if(session)location.replace(next&&next.startsWith('/')?next:'/')});login.onclick=async()=>{msg.textContent='';const{error}=await c.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.replace(next&&next.startsWith('/')?next:'/')};password.addEventListener('keydown',e=>{if(e.key==='Enter')login.click()});eye.onclick=()=>{const reveal=password.type==='password';password.type=reveal?'text':'password';eye.setAttribute('aria-label',reveal?'Ocultar senha':'Mostrar senha')}</script></body></html>
