name: Garmin Run Now

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Data inicial (YYYY-MM-DD). Vazio = hoje em São Paulo'
        required: false
        type: string
      days:
        description: 'Quantidade de dias (1-7)'
        required: false
        default: '1'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Garmin sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DAYS: ${{ inputs.days }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          else
            DATE=$(TZ=America/Sao_Paulo date +%F)
          fi
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://gi-tools.vercel.app/api/garmin-sync?date=${DATE}&days=${INPUT_DAYS}"
