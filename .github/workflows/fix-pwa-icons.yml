name: Fix PWA icons

on:
  push:
    branches: [icon-fix-use-this-one]
    paths:
      - '.github/workflows/fix-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icon-fix-use-this-one
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert icons to RGB and update metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re

          root = Path('.')

          src180 = root / 'apple-touch-icon-gica-20261026.png'
          if not src180.exists():
              raise SystemExit('missing source 180 icon')
          im180 = Image.open(src180).convert('RGB')
          if im180.size != (180, 180):
              raise SystemExit(f'180 icon has wrong size: {im180.size}')
          im180.save(root / 'apple-touch-icon.png', format='PNG', optimize=True)
          im180.save(root / 'apple-touch-icon-v2.png', format='PNG', optimize=True)

          src512 = root / 'icon-512.png'
          if not src512.exists():
              raise SystemExit('missing source 512 icon')
          im512 = Image.open(src512).convert('RGB')
          if im512.size != (512, 512):
              raise SystemExit(f'512 icon has wrong size: {im512.size}')
          im512.save(root / 'icon-512.png', format='PNG', optimize=True)
          im512.save(root / 'icon-512-v2.png', format='PNG', optimize=True)

          html_files = [
              root / 'index.html',
              root / 'login.html',
              root / 'academia' / 'index.html',
              root / 'check-in-diario' / 'index.html',
              root / 'escrita-diaria' / 'index.html',
              root / 'install-test.html',
          ]
          for p in html_files:
              if not p.exists():
                  continue
              s = p.read_text()
              s = re.sub(r'href="/(?:api/apple-touch-icon-rgb\.png|apple-touch-icon-gica-20261026\.png|apple-touch-icon\.png|apple-touch-icon-v2\.png)"', 'href="/apple-touch-icon-v2.png"', s)
              p.write_text(s)

          for name in ['manifest.webmanifest', 'manifest-test.webmanifest']:
              p = root / name
              if not p.exists():
                  continue
              data = json.loads(p.read_text())
              data['icons'] = [
                  {'src': '/apple-touch-icon-v2.png', 'sizes': '180x180', 'type': 'image/png', 'purpose': 'any'},
                  {'src': '/icon-512-v2.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
              ]
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # Validate PNG color type directly from IHDR: 2 = truecolor RGB.
          for p, expected in [(root/'apple-touch-icon-v2.png',(180,180)), (root/'icon-512-v2.png',(512,512))]:
              raw = p.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n'
              w = int.from_bytes(raw[16:20], 'big')
              h = int.from_bytes(raw[20:24], 'big')
              bit_depth = raw[24]
              color_type = raw[25]
              print(p, w, h, 'bit_depth', bit_depth, 'color_type', color_type)
              assert (w,h) == expected
              assert bit_depth == 8
              assert color_type == 2
          PY

      - name: Remove temporary converter endpoints
        run: |
          rm -f api/apple-touch-icon-rgb.png.js api/icon-512-rgb.png.js lib/png-rgb.js

      - name: Commit generated RGB icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Generate truecolor RGB PWA icons'
          git push origin HEAD:icon-fix-use-this-one
